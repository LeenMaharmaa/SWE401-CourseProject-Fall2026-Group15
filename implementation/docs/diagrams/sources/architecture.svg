<svg xmlns="http://www.w3.org/2000/svg" id="diagram" width="1200" height="825" viewBox="0 0 1200 825"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#967cb1" stroke-width="1.5"/></marker></defs><rect width="1200" height="825" fill="#fcfaff"/><text x="40" y="48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#342447">Application architecture</text><text x="40" y="78" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#82718e">A small layered application with local persistence</text><rect x="70" y="140" width="1060" height="135" rx="12" fill="white" stroke="#d5c5e8" stroke-width="2"/><path d="M70 188H1130" stroke="#e6ddf0"/><text x="88" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6336a0">Presentation layer</text><text x="88" y="215" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">React screens: account access, profile, analysis, compatibility, experience, interview preparation, and history</text><text x="88" y="240" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">Tailwind CSS and shadcn/ui provide a consistent light interface.</text><polyline points="600,275 600,335" fill="none" stroke="#967cb1" stroke-width="2" marker-end="url(#arrow)"/><text x="625" y="310" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#776289">User actions and displayed results</text><rect x="70" y="335" width="1060" height="180" rx="12" fill="white" stroke="#d5c5e8" stroke-width="2"/><path d="M70 383H1130" stroke="#e6ddf0"/><text x="88" y="366" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6336a0">Application layer</text><text x="88" y="410" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">Next.js server endpoints validate inputs and coordinate the four preparation services.</text><text x="88" y="435" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">AnalysisController responsibilities | ScoreController responsibilities | OptimizeController responsibilities | PracticeController responsibilities</text><text x="88" y="460" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">Zod checks response structure and source evidence; application code computes the compatibility percentage.</text><polyline points="330,515 330,585" fill="none" stroke="#967cb1" stroke-width="2" marker-end="url(#arrow)"/><text x="345" y="557" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#776289">Read and save records</text><polyline points="850,515 850,585" fill="none" stroke="#967cb1" stroke-width="2" marker-end="url(#arrow)"/><text x="865" y="557" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#776289">Structured requests and responses</text><rect x="70" y="585" width="510" height="155" rx="12" fill="white" stroke="#d5c5e8" stroke-width="2"/><path d="M70 633H580" stroke="#e6ddf0"/><text x="88" y="616" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6336a0">Persistence</text><text x="88" y="660" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">SQLite local database</text><text x="88" y="685" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">Accounts, profiles, job descriptions, analyses, and saved results</text><rect x="620" y="585" width="510" height="155" rx="12" fill="white" stroke="#d5c5e8" stroke-width="2"/><path d="M620 633H1130" stroke="#e6ddf0"/><text x="638" y="616" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6336a0">External language service</text><text x="638" y="660" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">Google Gemini API</text><text x="638" y="685" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#342447">Model: gemini-3.5-flash-lite</text><text x="70" y="785" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#342447">The application runs locally. Internet access is required only for Gemini requests.</text></svg>