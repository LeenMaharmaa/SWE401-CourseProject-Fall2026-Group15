const sheet=document.getElementById('sheet'),viewport=document.getElementById('viewport'),zoom=document.getElementById('zoom');let mode='readable',scale=1;
function setScale(v){scale=Math.max(.2,Math.min(1.5,v));sheet.style.width=(1200*scale)+'px';zoom.textContent=Math.round(scale*100)+'%';viewport.style.justifyContent=sheet.getBoundingClientRect().width>viewport.clientWidth?'flex-start':'center'}
function layout(){const head=document.querySelector('header').getBoundingClientRect().height,available=innerHeight-head-(document.body.classList.contains('capture')?20:32),width=(innerWidth-(innerWidth<850?20:40))/1200;let s=Math.min(width,available/1950);if(mode==='readable')s=Math.min(width,Math.max(.62,s));setScale(s)}
document.getElementById('fit').onclick=()=>{mode='fit';layout()};document.getElementById('readable').onclick=()=>{mode='readable';layout()};document.getElementById('plus').onclick=()=>{mode='manual';setScale(scale+.1)};document.getElementById('minus').onclick=()=>{mode='manual';setScale(scale-.1)};document.getElementById('capture').onclick=()=>{document.body.classList.add('capture');mode='fit';layout()};document.getElementById('print').onclick=()=>print();addEventListener('resize',()=>{if(mode!=='manual')layout()});addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('capture');layout()}});layout();
</script></body></html>
