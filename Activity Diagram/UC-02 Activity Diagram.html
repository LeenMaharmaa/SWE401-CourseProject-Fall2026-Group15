</style></head><body><header><div class="title-block"><span class="index">02</span><div><div class="kicker">SKILL BRIDGE AI / ACTIVITY DIAGRAM</div><h1>Calculate Compatibility Score</h1></div></div><nav class="tools" aria-label="Diagram controls"><button id="fit">Fit screen</button><button id="readable">Readable size</button><button id="minus" aria-label="Zoom out">−</button><output id="zoom" aria-live="polite"></output><button id="plus" aria-label="Zoom in">+</button><button id="capture">Screenshot view</button><button id="print">Print</button></nav></header><main><div class="viewport" id="viewport"><div class="sheet" id="sheet"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1530" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">UC-02 Calculate Compatibility Score</title><desc id="diagram-desc">Precondition: job description analysis has successfully generated and saved its results. Profile completion is handled in UC-01. Three vertical lanes show one AI comparison request per attempt, matching and missing skills returned together, system percentage calculation, separate retries, explained results with an estimate disclaimer, and saving to history. Cancellation ends at flow finals. Successful completion ends at an activity final.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#38483f" stroke-width="1.6"/></marker></defs><rect width="1200" height="1530" fill="#fcfaf3"/><rect width="360" height="1530" fill="#f5f1e5"/><rect x="860" width="340" height="1530" fill="#eaf0e7"/><path d="M360 0V1530 M860 0V1530 M0 48H1200" class="lane-rule"/><text class="lane-title" x="180" y="32">Job Seeker</text><text class="lane-title" x="610" y="32">Skill Bridge AI System</text><text class="lane-title" x="1030" y="32">AI/NLP Service</text><path id="flow-start-select" d="M180 85 L180 105" class="flow"/><path id="flow-selec ss="action"/><text class="node-text"><tspan x="650" y="140">Retrieve saved analysis</tspan><tspan x="650" y="166">and profile details</tspan></text></g><g id="comparison-merge" class="node system" data-kind="merge"><polygon class="merge" points="650,230.0 660.0,240 650,250.0 640.0,240"/></g><g id="request" class="node system" data-kind="action"><rect x="510.0" y="270.0" width="280" height="80" rx="13" class="action"/><text class="node-text"><tspan x="650" y="305">Send profile and</tspan><tspan x="650" y="331">job requirements</tspan></text></g><g id="compare" class="node ai" data-kind="action"><rect x="885.0" y="255.0" width="290" height="110" rx="13" class="action"/><text class="node-text"><tspan x="1030" y="292">Compare profile</tspan><tspan x="1030" y="318">Identify matching</tspan><tspan x="1030" y="344">and missing skills</tspan></text></g><g id="response" class="node system" data-kind="action"><rect x="510.0" y="410.0" width="280" height="80" rx="13" class="action"/><text class="node-text"><tspan x="650" y="445">Receive comparison</tspan><tspan x="650" y="471">or request failure</tspan></text></g><g id="comparison-ok" class="node system" data-kind="decision"><polygon class="decision" points="650,510.0 760.0,580 650,650.0 540.0,580"/><text class="node-text decision-text"><tspan x="650" y="575">Comparison</tspan><tspan x="650" y="601">successful?</tspan></text></g><g id="comparison-error" class="node system" data-kind="action"><rect x="375.0" y="540.0" width="150" height="80" rx="13" class="action"/><text class="node-text"><tspan x="450" y="575">Show AI</tspan><tspan x="450" y="601">error</tspan></text></g><g id="retry-comparison" class="node user" data-kind="decision"><polygon class="decision" points="180,505.0 295.0,580 180,655.0 65.0,580"/><text class="node-text decision-text"><tspan x="180" y="575">Retry</tspan><tspan x="180" y="601">comparison?</tspan></text></g><g id="comparison-stop" class="node user" data-kind="flow-final"><circle cx="180" cy="710" r="16" class="final-ring"/><path d="M170 700L190 720 M170 720L190 700" class="flow-cross"/></g><g id="calculation-merge" class="node system" data-kind="merge"><polygon class="merge" points="650,720.0 660.0,730 650,740.0 640.0,730"/></g><g id="calculate" class="node system" data-kind="action"><rect x="495.0" y="770.0" width="310" height="80" rx="13" class="action"/><text class="node-text"><tspan x="650" y="805">Calculate compatibility</tspan><tspan x="650" y="831">percentage</tspan></text></g><g id="calculation-ok" class="node system" data-kind="decision"><polygon class="decision" points="650,880.0 760.0,950 650,1020.0 540.0,950"/><text class="node-text decision-text"><tspan x="650" y="945">Calculation</tspan><tspan x="650" y="971">successful?</tspan></text></g><g id="calculation-error" class="node system" data-kind="action"><rect x="375.0" y="910.0" width="150" height="80" rx="13" class="action"/><text class="node-text"><tspan x="450" y="945">Show calc.</tspan><tspan x="450" y="971">error</tspan></text></g><g id="retry-calculation" class="node user" data-kind="decision"><polygon class="decision" points="180,875.0 295.0,950 180,1025.0 65.0,950"/><text class="node-text decision-text"><tspan x="180" y="945">Retry</tspan><tspan x="180" y="971">calculation?</tspan></text></g><g id="calculation-stop" class="node user" data-kind="flow-final"><circle cx="180" cy="1080" r="16" class="final-ring"/><path d="M170 1070L190 1090 M170 1090L190 1070" class="flow-cross"/></g><g id="explanation" class="node system" data-kind="action"><rect x="510.0" y="1080.0" width="280" height="80" rx="13" class="action"/><text class="node-text"><tspan x="650" y="1115">Build score</tspan><tspan x="650" y="1141">explanation</tspan></text></g><g id="display" class="node system" data-kind="action"><rect x="475.0" y="1200.0" width="350" height="120" rx="13" class="action"/><text class="node-text"><tspan x="650" y="1242">Display score, matching</tspan><tspan x="650" y="1268">and missing skills,</tspan><tspan x="650" y="1294">explanation and disclaimer</tspan></text></g><g id="save" class="node system" data-kind="action"><rect x="500.0" y="1360.0" width="300" height="80" rx="13" class="action"/><text class="node-text"><tspan x="650" y="1395">Save compatibility</tspan><tspan x="650" y="1421">results to history</tspan></text></g><g id="end" class="node system" data-kind="activity-final"><circle cx="650" cy="1490" r="16" class="final-ring"/><circle cx="650" cy="1490" r="10" class="solid"/></g><text class="guard" x="531" y="561">[no]</text><text class="guard" x="695" y="690">[yes]</text><text class="guard" x="227" y="478">[yes]</text><text class="guard" x="224" y="681">[no]</text><text class="guard" x="531" y="931">[no]</text><text class="guard" x="695" y="1055">[yes]</text><text class="guard" x="227" y="849">[yes]</text><text class="guard" x="224" y="1052">[no]</text><rect x="1" y="1" width="1198" height="1528" class="frame"/></svg></div></div></main><script>
const sheet=document.getElementById('sheet'),viewport=document.getElementById('viewport'),zoom=document.getElementById('zoom');let mode='readable',scale=1;
function setScale(v){scale=Math.max(.2,Math.min(1.5,v));sheet.style.width=(1200*scale)+'px';zoom.textContent=Math.round(scale*100)+'%';viewport.style.justifyContent=sheet.getBoundingClientRect().width>viewport.clientWidth?'flex-start':'center'}
function layout(){const head=document.querySelector('header').getBoundingClientRect().height,available=innerHeight-head-(document.body.classList.contains('capture')?20:32),width=(innerWidth-(innerWidth<850?20:40))/1200;let s=Math.min(width,available/1530);if(mode==='readable')s=Math.min(width,Math.max(.62,s));setScale(s)}
document.getElementById('fit').onclick=()=>{mode='fit';layout()};document.getElementById('readable').onclick=()=>{mode='readable';layout()};document.getElementById('plus').onclick=()=>{mode='manual';setScale(scale+.1)};document.getElementById('minus').onclick=()=>{mode='manual';setScale(scale-.1)};document.getElementById('capture').onclick=()=>{document.body.classList.add('capture');mode='fit';layout()};document.getElementById('print').onclick=()=>print();addEventListener('resize',()=>{if(mode!=='manual')layout()});addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('capture');layout()}});layout();
</script></body></html>
